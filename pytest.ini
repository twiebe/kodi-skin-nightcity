[pytest]
markers =
    e2e: end-to-end tests against kodi-dev
    nightcity_look: e2e tests that check Nightcity's colours or palettes, skipped under NC_SKIN=confuse
    slow: e2e tests that take more than 20 s; skip them with -m "e2e and not slow"
    fps(n): run the test at n frames a second, over kodi-dev's KODI_FPS_CAP (tests/e2e/conftest.py _fps)
